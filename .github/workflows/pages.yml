name: Deploy Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deployment at a time; new pushes wait.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          # site 独立 lockfile 暂留 pnpm 10:pnpm 11 装 site 依赖会因 @parcel/watcher 的
          # build script 未审批报 ERR_PNPM_IGNORED_BUILDS,需先给 site 配 allowBuilds 再升级。
          version: 10

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml

      - name: Install
        working-directory: site
        # site 是独立子站,根目录的 pnpm-workspace.yaml 会让 pnpm 把它当
        # workspace 成员、依赖装不进 site/node_modules,用 --ignore-workspace 独立安装。
        run: pnpm install --frozen-lockfile --ignore-workspace

      - name: Sync version into HTML
        # 从根 package.json 读 version,sed 替换 site HTML 里的
        # JSON-LD softwareVersion(给搜索引擎读静态值,等不到 JS 跑完)。
        # 其他显示位置(nav / hero / 下载区)由 releases.js 在浏览器里
        # 拉 GitHub Releases API 动态覆盖,这里只管 SSR-visible 那条。
        run: |
          VERSION=$(jq -r .version package.json)
          echo "Syncing site version → $VERSION"
          sed -i "s/\"softwareVersion\": \"[^\"]*\"/\"softwareVersion\": \"$VERSION\"/g" site/index.html site/zh/index.html

      - name: Build Tailwind
        working-directory: site
        run: pnpm build

      - name: Stage deployable files
        # 把可发布的静态文件复制到 _site/,排除 node_modules / 源文件 / 配置。
        # 用 rsync exclude 而不是 whitelist,让未来加新子页面(download/ guides/ faq/)
        # 不用回来改 workflow。
        run: |
          mkdir -p _site
          rsync -a \
            --exclude='node_modules' \
            --exclude='package.json' \
            --exclude='pnpm-lock.yaml' \
            --exclude='input.css' \
            --exclude='.gitignore' \
            --exclude='README.md' \
            site/ _site/

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
