name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend lint + format + test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # 版本号漂移(package.json / Cargo.toml / tauri.conf.json / Cargo.lock / 官网 HTML)
      # 在 PR 阶段就挡住,别等到打 tag 才在 release preflight 里炸。
      - name: Version consistency check
        run: bash scripts/check-version-consistency.sh

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          # pnpm 11 uses npm's supported bulk advisory endpoint for audits.
          version: 11.13.0

      - name: Install Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      # 只审生产依赖:dev 工具链(vitest/jsdom/undici 等)的传递漏洞不进
      # 最终 app,不该卡 CI;生产依赖当前零漏洞,-D low 门槛守得住。
      # npm registry 偶发超时（error 23），pnpm 内置重试不够，外层再试几次。
      - name: Audit production deps
        run: |
          set -euo pipefail
          n=0
          until pnpm audit --prod --audit-level=low; do
            n=$((n + 1))
            if [ "$n" -ge 3 ]; then
              echo "::error::pnpm audit failed after ${n} attempts"
              exit 1
            fi
            echo "audit attempt $n failed; retry in 20s"
            sleep 20
          done

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Brand asset consistency check
        run: pnpm brand:check

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Playwright smoke
        run: node scripts/test-playwright-smoke.mjs

      - name: Test
        run: pnpm test:run

      - name: Download docs check
        run: pnpm docs:download:check

  quickstart-smoke:
    name: Quickstart core smoke
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.13.0

      - name: Install Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable

      - name: Rust cache
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri
          key: quickstart-smoke

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Run quickstart smoke
        run: pnpm test:quickstart

  fixture-tests:
    name: Offline capability + protocol fixture tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # `tauri` is in the dependency graph of the test binaries even though
      # the tests never spin up a window, so the linker still needs gdk /
      # webkit headers at compile time. Mirror release.yml's build deps.
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Rust cache
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri
          key: fixture-tests

      - name: Rustfmt check
        working-directory: src-tauri
        run: cargo fmt --check

      # clippy 与下面的 lib test 用同一 feature 组合(cli,无 GUI),复用同一份缓存编译。
      # -D warnings:存量已清零,之后任何新 warning 直接挡在 CI。
      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --no-default-features --features cli --lib -- -D warnings

      # cli feature 的 agentgate-serve bin 不在 `cargo test` 的编译范围内,
      # 单独 build 一次,防止 CLI 编译失败只在 release 才暴露(1.3.6 就是这么漏的)。
      - name: Build headless agentgate-serve (no Tauri)
        working-directory: src-tauri
        run: cargo build --no-default-features --features cli --bin agentgate-serve

      # lib 单元测试(1100+ 个)之前完全没进 CI,导致单测回归长期潜伏
      # (如 pricing 红测试)。复用上面的 cli 编译缓存跑一遍。
      - name: Run library unit tests
        working-directory: src-tauri
        run: cargo test --no-default-features --features cli --lib

      - name: Run capability + protocol fixture tests
        working-directory: src-tauri
        run: |
          cargo test --test capability_fixture \
                     --test mimo_capabilities \
                     --test deepseek_capabilities \
                     --test kimi_capabilities \
                     --test protocol_fixture \
                     --test copilot_upstream \
                     -- --nocapture

  desktop-tests:
    name: Desktop clippy + lib tests + bindings drift
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # desktop feature 编译产物和 fixture-tests 的 cli 产物叠在同一 runner 上会逼近
      # ubuntu-22.04 的磁盘上限(No space left on device),拆成独立 job、独立缓存。
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          components: clippy

      - name: Rust cache
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri
          key: desktop-tests

      # fixture-tests 的 clippy / lib test 只覆盖 cli feature,桌面代码(src-tauri/src/app/**、lib.rs、
      # #[tauri::command])之前从没被 lint / 测过。这里用默认 desktop feature 再跑一遍。
      - name: Clippy (desktop, all targets)
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Run library unit tests (desktop)
        working-directory: src-tauri
        run: cargo test --lib

      # desktop lib test 里的 specta_export_tests::full_export_covers_all_domains 会重新生成
      # src/lib/bindings.ts;有 diff 说明改了 command / 类型却没提交新 bindings。
      - name: TS bindings drift check
        run: |
          if ! git diff --exit-code -- src/lib/bindings.ts; then
            echo "::error file=src/lib/bindings.ts::src/lib/bindings.ts is stale. Run 'cargo test --manifest-path src-tauri/Cargo.toml --lib specta_export_tests' locally and commit the regenerated file."
            exit 1
          fi

  cargo-audit:
    name: Rust dependency audit
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # 预编译二进制,秒级安装,不用每次 cargo install 编译。
      - name: Install cargo-audit
        uses: taiki-e/install-action@3f74d7c16a4242f1c95561e98edc25d36adb4375 # v2
        with:
          tool: cargo-audit

      # 默认只对 vulnerability 级 RUSTSEC 漏洞 fail;unmaintained / unsound
      # 类 warning(多为 tauri/webkit 桌面传递依赖)不阻断。当前 0 漏洞。
      - name: Audit Rust deps
        working-directory: src-tauri
        run: cargo audit
