name: Release

on:
  push:
    tags:
      - 'v*'

# 默认只读;需要建 release / 传资产 / 改 release 状态的 job 各自单独申请 contents: write。
permissions:
  contents: read

# 发版流程:preflight → create-release(草稿)→ build / updater-json / cli 全部往草稿上传
# → publish 最后一步转正式并标 latest → homebrew-cask。
# 任何一个平台失败,release 都停在草稿,releases/latest/download/latest.json 仍指向上一个
# 正式版,已安装的客户端不会检查更新 404。修好后 re-run 失败的 job 即可继续。
jobs:
  preflight:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # 第一道闸:tag 版本必须和 package.json / Cargo.toml / tauri.conf.json / Cargo.lock /
      # 官网 HTML 一致,否则 latest.json 的 version 与 app 自身版本对不上,更新器会一直提示新版本。
      - name: Version consistency check (tag)
        run: bash scripts/check-version-consistency.sh "${GITHUB_REF_NAME#v}"

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.27.1

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Provider catalog drift check
        run: pnpm provider:catalog:check

      - name: Brand asset consistency check
        run: pnpm brand:check

      # gdk-sys / webkit headers needed for cargo to link the tauri-based
      # test binaries even though no GUI gets opened.
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable

      - name: Rust cache
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri
          key: preflight-fixture

      - name: Offline capability + protocol fixture tests
        working-directory: src-tauri
        run: |
          cargo test --test capability_fixture \
                     --test mimo_capabilities \
                     --test deepseek_capabilities \
                     --test kimi_capabilities \
                     --test protocol_fixture \
                     --test copilot_upstream

      - name: Docker preflight
        run: bash scripts/release-preflight.sh

  # 单独一个 job 先建草稿 release,把 id 传给后面所有 job。
  # 不让 4 个 build 各自 getOrCreate:草稿不会被 GitHub 按 tag 去重,并发创建会出现多个同 tag 草稿。
  create-release:
    needs: preflight
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.release.outputs.id }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22

      - name: Create or reuse draft release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"

          # 草稿 release 查不到 /releases/tags/{tag},只能翻 release 列表按 tag_name 匹配。
          find_ids() {
            gh api --paginate "repos/${GH_REPO}/releases?per_page=100" \
              --jq ".[] | select(.tag_name == \"${TAG}\") | .id"
          }

          ids="$(find_ids)"
          if [ -z "$ids" ]; then
            node scripts/extract-release-notes.mjs "$VERSION" > "$RUNNER_TEMP/release-notes.md"
            # 等价于 gh release create --verify-tag:tag 必须已在远端存在。
            gh api "repos/${GH_REPO}/git/ref/tags/${TAG}" --silent
            # id 直接取创建响应:创建后立刻翻 release 列表可能因最终一致性查不到新草稿。
            ids="$(gh api -X POST "repos/${GH_REPO}/releases" \
              -f tag_name="$TAG" \
              -f name="$TAG" \
              -f body="$(cat "$RUNNER_TEMP/release-notes.md")" \
              -F draft=true \
              --jq .id)"
          else
            # re-run 场景:复用已有 release(草稿或已发布),不重复创建。
            echo "Reusing existing release for ${TAG}"
          fi

          count="$(printf '%s\n' "$ids" | grep -c . || true)"
          if [ "$count" -ne 1 ]; then
            echo "::error::expected exactly one release for ${TAG}, found ${count}: ${ids}"
            exit 1
          fi
          echo "release id=${ids}"
          echo "id=${ids}" >> "$GITHUB_OUTPUT"

  build:
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-14
            args: --target aarch64-apple-darwin --bundles app,dmg
            rust_target: aarch64-apple-darwin
          - platform: macos-14
            args: --target x86_64-apple-darwin --bundles app,dmg
            rust_target: x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: --bundles appimage,deb
            rust_target: ''
          - platform: windows-2022
            args: --bundles nsis
            rust_target: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install dependencies (Ubuntu)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install dependencies (Windows)
        if: matrix.platform == 'windows-2022'
        run: choco install wixtoolset nsis -y --no-progress

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.27.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.rust_target }}

      - name: Rust cache
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm build

      - name: Prepare App Store Connect API key
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
        run: |
          if [ -z "$APPLE_API_KEY" ] || [ -z "$APPLE_API_KEY_CONTENT" ]; then
            echo "APPLE_API_KEY and APPLE_API_KEY_CONTENT secrets are required for macOS notarization" >&2
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/private_keys"
          api_key_path="$RUNNER_TEMP/private_keys/AuthKey_${APPLE_API_KEY}.p8"
          printf '%s' "$APPLE_API_KEY_CONTENT" > "$api_key_path"
          echo "APPLE_API_KEY_PATH=$api_key_path" >> "$GITHUB_ENV"

      - name: Check updater signing key
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY secret is required because createUpdaterArtifacts is enabled"
            exit 1
          fi

      # 这一步 env 里有签名私钥 / Apple 证书密码 / 公证 key,action 必须钉死 commit SHA。
      # 传 releaseId 后 tauri-action 只往这个草稿上传,不再自己建 release。
      - name: Build Tauri
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        with:
          tagName: ${{ github.ref_name }}
          releaseId: ${{ needs.create-release.outputs.release_id }}
          # 4 个平台并行各自删/传 latest.json 会撞 422 同名冲突;latest.json 统一由
          # 下面 updater-json job 的 scripts/publish-updater-json.mjs 合并生成。
          includeUpdaterJson: false
          args: ${{ matrix.args }} --config src-tauri/tauri.ci.conf.json

  updater-json:
    needs: [create-release, build]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22

      - name: Publish merged updater JSON
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
        run: node scripts/publish-updater-json.mjs

  cli:
    needs: updater-json
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            archive: agentgate-serve-aarch64-apple-darwin.tar.gz
            bin: agentgate-serve
          - platform: macos-latest
            target: x86_64-apple-darwin
            archive: agentgate-serve-x86_64-apple-darwin.tar.gz
            bin: agentgate-serve
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            archive: agentgate-serve-x86_64-unknown-linux-gnu.tar.gz
            bin: agentgate-serve
          - platform: windows-2022
            target: x86_64-pc-windows-msvc
            archive: agentgate-serve-x86_64-pc-windows-msvc.zip
            bin: agentgate-serve.exe

    runs-on: ${{ matrix.platform }}
    env:
      CARGO_TARGET_DIR: src-tauri/target/cli-${{ matrix.target }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install dependencies (Ubuntu)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri
          key: cli-${{ matrix.target }}

      - name: Build CLI
        run: cargo build --manifest-path src-tauri/Cargo.toml --release --no-default-features --features cli --target ${{ matrix.target }} --bin agentgate-serve

      - name: Package CLI (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          tar -C "$CARGO_TARGET_DIR/${{ matrix.target }}/release" -czf "dist/${{ matrix.archive }}" "${{ matrix.bin }}"

      - name: Package CLI (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path "$env:CARGO_TARGET_DIR/${{ matrix.target }}/release/${{ matrix.bin }}" -DestinationPath "dist/${{ matrix.archive }}"

      # gh 按 tag 能找到草稿 release,这里仍往草稿上传。
      - name: Upload CLI to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" "dist/${{ matrix.archive }}" --clobber

  # 最后一步才把草稿转正式并标 latest:此时桌面安装包、签名、latest.json、CLI 包都已就位。
  # 等 cli 一起完成,避免公开的 release 缺 CLI 资产。
  publish:
    needs: [updater-json, cli]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Publish draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No checkout on this job — force gh to the release repo (not cwd).
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          assets="$(gh release view "$TAG" --json assets --jq '.assets[].name')"
          if ! printf '%s\n' "$assets" | grep -qx 'latest.json'; then
            echo "::error::latest.json is missing on ${TAG}; refusing to publish"
            printf '%s\n' "$assets"
            exit 1
          fi
          gh release edit "$TAG" --draft=false --latest
          echo "Published ${TAG}"

  # 发布成功后自动更新 Homebrew tap 的 cask(version + 两个 dmg 的 sha256)。
  # 需要仓库 Secret HOMEBREW_TAP_SSH_KEY:dengmengmian/homebrew-tap 上一把带写权限的
  # deploy key 私钥。用 deploy key 而不是 PAT,是因为 fine-grained PAT 强制带过期时间
  # (最长 366 天),到期后这个 job 会在 clone 处静默失效;deploy key 不过期,且只能动
  # 这一个仓库。push 走 SSH deploy key,GITHUB_TOKEN 只需读 release,继承顶层 contents: read。
  # needs publish:cask 只能指向已公开的 release,草稿的 dmg 用户下不到。
  homebrew-cask:
    needs: publish
    runs-on: ubuntu-22.04
    steps:
      - name: Update tap cask
        env:
          TAP_SSH_KEY: ${{ secrets.HOMEBREW_TAP_SSH_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No checkout on this job — force gh to the release repo (not cwd).
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ -z "$TAP_SSH_KEY" ]; then
            echo "::error::HOMEBREW_TAP_SSH_KEY secret is required to update dengmengmian/homebrew-tap"
            exit 1
          fi
          VERSION="${GITHUB_REF_NAME#v}"
          TAG="${GITHUB_REF_NAME}"
          ARM_NAME="MuxLayer_${VERSION}_aarch64.dmg"
          X64_NAME="MuxLayer_${VERSION}_x64.dmg"

          # Multi-arch tauri-action uploads race; poll until both DMGs are listed
          # on the release (or fail with a clear asset dump after ~10 minutes).
          echo "Waiting for ${ARM_NAME} and ${X64_NAME} on ${TAG}..."
          for i in $(seq 1 30); do
            assets=$(gh release view "$TAG" --json assets --jq '.assets[].name' || true)
            if echo "$assets" | grep -qx "$ARM_NAME" && echo "$assets" | grep -qx "$X64_NAME"; then
              echo "Both DMGs present (attempt $i)."
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "::error::Release ${TAG} is missing required DMG(s) after waiting."
              echo "Required: ${ARM_NAME}, ${X64_NAME}"
              echo "Available assets:"
              echo "$assets"
              exit 1
            fi
            echo "attempt $i: not ready yet; assets:"
            echo "$assets" | sed 's/^/  /' || true
            sleep 20
          done

          gh release download "$TAG" -p "$ARM_NAME" -p "$X64_NAME"
          ARM_SHA=$(sha256sum "$ARM_NAME" | cut -d' ' -f1)
          X64_SHA=$(sha256sum "$X64_NAME" | cut -d' ' -f1)
          echo "arm sha256=${ARM_SHA}"
          echo "x64 sha256=${X64_SHA}"

          # deploy key 只用于这一次 clone/push,写到 runner 私有目录后立刻收紧权限。
          mkdir -p "$HOME/.ssh" && chmod 700 "$HOME/.ssh"
          printf '%s\n' "$TAP_SSH_KEY" > "$HOME/.ssh/tap_deploy_key"
          chmod 600 "$HOME/.ssh/tap_deploy_key"
          ssh-keyscan -t ed25519 github.com >> "$HOME/.ssh/known_hosts" 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/tap_deploy_key -o IdentitiesOnly=yes"

          git clone --depth 1 git@github.com:dengmengmian/homebrew-tap.git tap
          for CASK in tap/Casks/muxlayer.rb tap/Casks/agentgate.rb; do
            test -f "$CASK"
            sed -E -i "s/^  version \"[0-9.]+\"/  version \"${VERSION}\"/" "$CASK"
            sed -E -i "s/(arm:   \")[0-9a-f]{64}/\1${ARM_SHA}/" "$CASK"
            sed -E -i "s/(intel: \")[0-9a-f]{64}/\1${X64_SHA}/" "$CASK"
            # Every maintained cask must receive the version and both real DMG hashes.
            grep -q "version \"${VERSION}\"" "$CASK"
            grep -q "$ARM_SHA" "$CASK"
            grep -q "$X64_SHA" "$CASK"
          done

          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- Casks/muxlayer.rb Casks/agentgate.rb
          if git diff --cached --quiet; then
            echo "Homebrew casks are already current."
            exit 0
          fi
          git commit -m "muxlayer ${VERSION}"
          git push
