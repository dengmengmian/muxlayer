services:
  agentgate:
    build: .
    ports:
      # 默认只发布到宿主机回环地址:容器内网关监听 0.0.0.0,若写成 "9090:9090"
      # 会把网关暴露给整个局域网/公网。确需远程访问时再显式改成 "0.0.0.0:9090:9090",
      # 并先配置网关鉴权与防火墙。
      - "127.0.0.1:9090:9090"
    volumes:
      - agentgate-data:/data
    environment:
      - MUXLAYER_HOST=0.0.0.0
      - MUXLAYER_PORT=9090
      - AGENTGATE_HOST=0.0.0.0
      - AGENTGATE_PORT=9090

volumes:
  agentgate-data:
